<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookie Clicker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
     <div class="game">
 
    <div class="click-area">
      <h1 id="score">0 ki</h1>
      <p id="cps">0 ki per seconde</p>
 
      <button id="ki-btn" class="saiyan">
        <img src="png" alt="saiyan" id="saiyin-img">
      </button>
 
    
      <div id="floating-container"></div>
    </div>
 

    <div class="shop">
      <div class="tabs">
        <button class="tab-btn active" data-tab="producers">Producenten</button>
        <button class="tab-btn" data-tab="upgrades">Upgrades</button>
      </div>
 
      <div id="producers" class="tab-content active">
       
      </div>
 
      <div id="upgrades" class="tab-content">
        
      </div>
    </div>
    <div class="liquid-glass">
  <p>Dit is een liquid glass effect!</p>
</div>

 

    <div class="purchases">
      <h2>Mijn aankopen</h2>
      <ul id="purchase-list">
        <li class="empty-msg">Nog niets gekocht...</li>
      </ul>
    </div>
 
  </div>
 
  <script src="script.js"></script>
</body>
</html>
